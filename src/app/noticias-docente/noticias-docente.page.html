<!-- src/app/noticias-docente/noticias-docente.page.html -->
<ion-content class="background">
  <div class="screen">
    <div class="card">

      <div class="header">
        <h1>MENÚ DE INFORMACIÓN</h1>
      </div>

      <!-- CUADRO 1: Información institucional -->
      <div class="section">
        <div class="section-title">Información institucional</div>

        <ion-button class="btn-outline" expand="block" (click)="abrir(urlMision)">
          MISIÓN
        </ion-button>

        <ion-button class="btn-outline" expand="block" (click)="abrir(urlVision)">
          VISIÓN
        </ion-button>

        <ion-button class="btn-outline" expand="block" (click)="abrir(urlSobreNosotros)">
          SOBRE NOSOTROS
        </ion-button>
      </div>

      <!-- CUADRO 2: Noticias -->
      <div class="section section-news">
        <div class="section-title strong">Noticias y eventos</div>

        <div class="news-card" (click)="abrir(urlNoticias)" role="button" tabindex="0">
          <div class="news-img">
            <img [src]="ultimaNoticia.imagen" alt="Última noticia" />
          </div>

          <div class="news-body">
            <div class="chip">Última noticia</div>
            <div class="news-title">{{ ultimaNoticia.titulo }}</div>
            <div class="news-date">{{ ultimaNoticia.fecha }}</div>
            <div class="news-excerpt">
              {{ ultimaNoticia.resumen }}
            </div>

            <ion-button class="btn-primary" expand="block" (click)="abrir(urlNoticias); $event.stopPropagation()">
              VER NOTICIAS Y EVENTOS
            </ion-button>
          </div>
        </div>
      </div>

    </div>
  </div>
</ion-content>
