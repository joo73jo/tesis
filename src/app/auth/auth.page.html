<ion-content class="background">
  <div class="page">

    <div class="login-card">

      <div class="logo-container">
        <h2 class="title">INGRESAR</h2>
        <h3 class="subtitle">{{ rol | uppercase }}</h3>
      </div>

      <div class="form-container">

        <div class="field">
          <span class="field-label">Correo electrónico</span>
          <ion-item lines="none" class="input-field">
            <ion-input
              type="email"
              [(ngModel)]="correo"
              placeholder="Ingrese su correo">
            </ion-input>
          </ion-item>
        </div>

        <div class="field">
          <span class="field-label">Contraseña</span>
          <ion-item lines="none" class="input-field">
            <ion-input
              type="password"
              [(ngModel)]="contrasena"
              placeholder="Ingrese su contraseña">
            </ion-input>
          </ion-item>
        </div>

        <ion-button
          expand="block"
          class="login-button"
          (click)="login()">
          INGRESAR
        </ion-button>

      </div>

    </div>

  </div>
</ion-content>
